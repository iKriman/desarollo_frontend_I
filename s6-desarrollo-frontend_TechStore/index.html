<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Tu tienda de tecnología</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">TechStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link categoria-btn" href="#" data-categoria="todos">Todos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link categoria-btn" href="#" data-categoria="Periféricos">Periféricos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link categoria-btn" href="#" data-categoria="Computación">Computación</a>
                    </li>
                </ul>
                <form id="formulario-busqueda" class="d-flex">
                    <input class="form-control me-2" type="search" id="input-busqueda" placeholder="Buscar producto..." aria-label="Search" required>
                    <button class="btn btn-outline-light" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <header class="bg-primary text-white text-center py-5 hero-section">
        <div class="container">
            <h1 class="display-4 fw-bold">Bienvenido a TechStore</h1>
            <p class="lead">El mejor hardware y periféricos al mejor precio</p>
        </div>
    </header>

    <main class="container my-5">
        <div class="row">
            <div class="col-lg-8">
                <h2 class="mb-4">Catálogo de Productos</h2>

                <div id="mensaje-error" class="d-none"></div>

                <div class="row g-4" id="lista-productos">
                </div>
            </div>

            <div class="col-lg-4 mt-5 mt-lg-0">
                <div class="card shadow-sm sticky-top" style="top: 80px;">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">🛒 Mi Carrito</h4>
                    </div>
                    <div class="card-body" id="contenedor-carrito">
                        <p class="text-muted text-center" id="carrito-vacio">El carrito está vacío.</p>
                        <ul class="list-group mb-3 d-none" id="lista-carrito"></ul>
                        <div class="d-flex justify-content-between fw-bold fs-5 mt-3 d-none" id="total-carrito-container">
                            <span>Total:</span>
                            <span id="total-precio">$0</span>
                        </div>
                    </div>
                    <div class="card-footer text-center d-none" id="footer-carrito">
                        <button class="btn btn-success w-100 fw-bold">Proceder al Pago</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 TechStore. Todos los derechos reservados.</p>
            <p class="mb-0">
                <a href="#" class="text-white text-decoration-none me-3">Facebook</a> | 
                <a href="#" class="text-white text-decoration-none ms-3 me-3">Instagram</a> | 
                <a href="#" class="text-white text-decoration-none ms-3">Contacto</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
